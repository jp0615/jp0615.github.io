<style>
@font-face{font-family:GardenHub;src:url(/h/hub-round.woff2) format('woff2');font-display:swap}
@font-face{font-family:PixelHub;src:url(/h/pixel.woff2) format('woff2');font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:GardenHub,"PingFang TC","Heiti TC","Noto Sans TC",sans-serif;color:#4a3b5c;
  background:linear-gradient(180deg,#ffe9f3 0%,#fff4e2 46%,#e4f3ff 100%) fixed;-webkit-user-select:none;user-select:none;overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cl{position:absolute;background:#fff;border-radius:999px;opacity:.8;animation:drift linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl::before{width:52%;height:150%;left:16%;top:-70%}.cl::after{width:36%;height:120%;left:52%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.spk{position:absolute;color:#ffd23f;font-size:18px;animation:tw 3.2s ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.9;transform:scale(1) rotate(30deg)}}
#wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 22px calc(env(safe-area-inset-bottom) + 22px)}
.flags{display:flex;justify-content:center;height:34px;margin:0 -22px 4px;overflow:hidden}
.flags i{width:34px;height:30px;flex:none;clip-path:polygon(0 0,100% 0,50% 100%);margin:0 2px;transform-origin:50% 0;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
header{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 18px}
#wheel{width:150px;height:150px;flex:none;filter:drop-shadow(0 6px 8px rgba(180,120,200,.25))}
.ttl{text-align:left}
h1{margin:0;font-size:60px;line-height:1.1;letter-spacing:2px;font-weight:800;white-space:nowrap}
h1 span{display:inline-block;color:var(--c);text-shadow:0 3px 0 #fff,0 -2px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 6px 10px rgba(150,90,160,.25);animation:hop 2.8s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
@keyframes hop{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-7px)}}
.hi{margin-top:8px;font-size:27px;color:#7a5a92;background:rgba(255,255,255,.75);display:inline-block;padding:8px 18px;border-radius:999px;box-shadow:0 4px 0 rgba(200,160,210,.35)}
#cards{display:grid;gap:22px}
.card{position:relative;display:grid;grid-template-columns:250px 1fr auto;align-items:center;gap:20px;min-height:200px;padding:16px 22px 16px 16px;text-decoration:none;color:inherit;
  border-radius:34px;background:var(--bg);box-shadow:0 10px 0 var(--sh),0 18px 28px rgba(120,80,140,.14);border:4px solid #fff;
  transition:transform .18s cubic-bezier(.3,1.6,.6,1),box-shadow .18s;opacity:0;transform:translateY(26px) scale(.97);animation:rise .6s cubic-bezier(.2,1.3,.5,1) forwards;animation-delay:calc(.08s + var(--i)*.1s)}
@keyframes rise{to{opacity:1;transform:none}}
.card.on{opacity:1;animation:none;transform:none}
.card:active,.card.press{transform:translateY(6px) scale(.985)!important;box-shadow:0 4px 0 var(--sh),0 8px 14px rgba(120,80,140,.12)}
.scene{height:168px;border-radius:24px;overflow:hidden;border:3px solid rgba(255,255,255,.95);box-shadow:inset 0 0 0 2px var(--sh)}
.scene svg{width:100%;height:100%;display:block}
.t{font-size:38px;font-weight:800;color:var(--tx);line-height:1.2}
.s{font-size:24px;color:var(--tx2);margin-top:4px}
.chip{display:inline-block;margin-top:10px;font-size:20px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.8);color:var(--tx2);min-height:38px}
.chip:empty{visibility:hidden}
.go{font-size:28px;font-weight:800;color:#fff;background:var(--ac);padding:20px 26px;border-radius:999px;box-shadow:0 6px 0 var(--sh);white-space:nowrap;animation:nudge 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.4s)}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(5px)}90%{transform:translateX(-2px)}}
.garden{--bg:linear-gradient(135deg,#fdeff5,#eef9e6);--sh:#f2bfd3;--tx:#5a7a3a;--tx2:#a0577a;--ac:#f07aa4}
.volley{--bg:linear-gradient(135deg,#fff1dc,#ffe2c0);--sh:#f5b97c;--tx:#b2560c;--tx2:#8a5a2a;--ac:#ff8a1f}
.blocks{--bg:#bfe6ff;--sh:#3b6e2a;--tx:#2c4a1e;--tx2:#2c4a1e;--ac:#5aa83a;border-radius:10px;border:4px solid #1e1e1e;box-shadow:inset -6px -6px 0 rgba(0,0,0,.12),inset 6px 6px 0 rgba(255,255,255,.5),0 10px 0 #3b6e2a,0 18px 28px rgba(60,90,40,.18)}
.blocks .scene{border-radius:4px;border:3px solid #1e1e1e;box-shadow:none}
.blocks .t,.blocks .s{font-family:PixelHub,GardenHub,sans-serif;text-shadow:2px 2px 0 rgba(255,255,255,.7);letter-spacing:1px}
.blocks .chip{border-radius:4px;font-family:PixelHub,GardenHub,sans-serif;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px #1e1e1e}
.blocks .go{border-radius:4px;font-family:PixelHub,GardenHub,sans-serif;box-shadow:inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.35),0 0 0 4px #1e1e1e;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.blocks:active,.blocks.press{box-shadow:inset -6px -6px 0 rgba(0,0,0,.12),0 3px 0 #3b6e2a!important}
/* scene motion */
.fw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite}
.bf{animation:fly 9s ease-in-out infinite}
@keyframes fly{0%{transform:translate(20px,70px)}25%{transform:translate(80px,40px) scale(1,.8)}50%{transform:translate(160px,64px)}75%{transform:translate(200px,30px) scale(1,.8)}100%{transform:translate(20px,70px)}}
.vb{animation:bx 2.2s ease-in-out infinite alternate}.vbs{animation:by 1.1s cubic-bezier(.4,0,.6,1) infinite alternate}
.vbs{animation-name:by}.vb .vbs circle{transform-origin:0 0}
@keyframes bx{from{transform:translateX(70px)}to{transform:translateX(170px)}}
@keyframes by{from{transform:translateY(150px)}to{transform:translateY(42px) rotate(200deg)}}
.vsh{animation:bx 2.2s ease-in-out infinite alternate}
.bk{animation:bob 1.6s steps(4) infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}
.sp{animation:bob 1.2s steps(3) infinite alternate-reverse}
footer{text-align:center;margin-top:26px;font-size:20px;color:#a08ab5}
/* leaving transition */
#veil{position:fixed;inset:0;z-index:9;pointer-events:none;background:var(--vc,#fff);clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .55s cubic-bezier(.6,0,.4,1);display:flex;align-items:center;justify-content:center}
#veil.go2{clip-path:circle(150% at var(--x,50%) var(--y,50%));pointer-events:auto}
#veil b{font-size:120px;transform:scale(.3);transition:transform .5s .15s cubic-bezier(.3,1.7,.5,1)}
#veil.go2 b{transform:scale(1)}
/* landscape: three columns */
@media (min-width:1000px) and (orientation:landscape){
  #wheel{width:118px;height:118px}h1{font-size:54px}.hi{font-size:24px}header{margin-bottom:16px}
  #cards{grid-template-columns:repeat(3,1fr);gap:24px}
  .card{grid-template-columns:1fr;text-align:center;padding:16px 16px 22px;gap:10px}
  .scene{height:250px}.go{justify-self:center;padding:18px 40px}
}
@media (orientation:portrait) and (min-width:701px){
  header{margin:14px 0 26px}#wheel{width:170px;height:170px}h1{font-size:66px}
  #cards{gap:30px}.card{grid-template-columns:280px 1fr auto;min-height:250px}.t{font-size:35px;white-space:nowrap}.scene{height:214px}
  .blocks .t{font-size:32px;white-space:nowrap}footer{margin-top:34px}
}
.blocks .t{white-space:nowrap}
@media (orientation:portrait) and (min-width:701px) and (max-width:799px){
  .card{grid-template-columns:230px 1fr auto;gap:16px;padding-right:16px}.scene{height:200px}
  .t,.blocks .t{font-size:30px}.go{font-size:24px;padding:18px 18px}
}
@media (max-width:700px){.card{grid-template-columns:1fr;text-align:center}.go{justify-self:center}h1{font-size:44px}#wheel{width:110px;height:110px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.card{opacity:1;transform:none}}
</style>

<script>
(function(){
try{localStorage.setItem('hub.on','1')}catch(e){}
var NAME_WHO='Brie';
function $(s){return document.querySelector(s)}
function J(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* welcome line by time of day */
var h=new Date().getHours(),g=h<11?'早安':h<18?'午安':'晚安';
$('#hi').textContent=NAME_WHO+'，'+g+'！今天想玩哪一個？';
/* progress chips */
function chips(){
  var v=J('vocabApp.v1'),t=J('timesApp.v1'),c=J('columnApp.v1'),a=[];
  if(v){var n=0;(v.weeks||[]).forEach(function(w){n+=(w.words||[]).length});a=[];if(+v.stars)a.push('⭐ '+(+v.stars));if(n)a.push(n+' 個單字');$('#cv').textContent=a.join('・')}
  if(t){a=[];if(+t.stars)a.push('⭐ '+(+t.stars));if(t.vb&&t.vb.team)a.push('🏐 '+t.vb.team);$('#ct').textContent=a.join('・')}
  if(c){var b=0,k;for(k in (c.inv||{}))b+=(+c.inv[k]||0);if(!c.inv&&+c.blocks)b=+c.blocks;$('#cc').textContent=b?'🎒 '+b+' 塊方塊':''}
}
chips();
/* background clouds + sparkles + flags */
var bg=$('#bg'),i,e;
for(i=0;i<5;i++){e=document.createElement('div');e.className='cl';var w=90+Math.random()*90;e.style.cssText='width:'+w+'px;height:'+(w*.32)+'px;top:'+(6+i*19)+'%;animation-duration:'+(55+i*14)+'s;animation-delay:-'+(i*17)+'s';bg.appendChild(e)}

  for(var k=0;k<gp.length;k++){var a=(k/3-1/3)*Math.PI+ang*Math.PI/180;gp[k].setAttribute('transform','translate('+(100+70*Math.cos(a)).toFixed(2)+' '+(110+70*Math.sin(a)).toFixed(2)+')')}
  if(!still&&!document.hidden)requestAnimationFrame(spin);else last=0}
requestAnimationFrame(spin);
document.addEventListener('visibilitychange',function(){if(!document.hidden){last=0;requestAnimationFrame(spin)}});
/* tiny chime */
var AC=null;function chime(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;[784,1175].forEach(function(f,j){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+j*.09);g.gain.linearRampToValueAtTime(.16,t+j*.09+.02);g.gain.exponentialRampToValueAtTime(.001,t+j*.09+.35);o.connect(g);g.connect(AC.destination);o.start(t+j*.09);o.stop(t+j*.09+.4)})}catch(e){}}
/* go to a game with a soft circle wipe */
var busy=false,veil=$('#veil');
[].forEach.call(document.querySelectorAll('.card'),function(c){
  c.addEventListener('animationend',function(ev){if(ev.target===c)c.classList.add('on')});
  c.addEventListener('click',function(ev){
    if(ev.metaKey||ev.ctrlKey)return;ev.preventDefault();if(busy)return;busy=true;
    var href=c.getAttribute('href');chime();c.classList.add('press');
    var r=c.getBoundingClientRect(),x=ev.clientX||r.left+r.width/2,y=ev.clientY||r.top+r.height/2;
    veil.style.setProperty('--x',x+'px');veil.style.setProperty('--y',y+'px');veil.style.setProperty('--vc',c.dataset.c);
    veil.querySelector('b').textContent=c.dataset.e;
    setTimeout(function(){c.classList.remove('press');veil.classList.add('go2')},120);
    setTimeout(function(){location.href=href},still?60:620);
    setTimeout(function(){busy=false},2500);
  });
});
window.addEventListener('pageshow',function(){veil.classList.remove('go2');busy=false;chips()});

if('serviceWorker' in navigator){window.addEventListener('load',function(){
  navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(function(){});
  setTimeout(function(){['vocab','times','column'].forEach(function(a){navigator.serviceWorker.register('/'+a+'/sw.js',{scope:'/'+a+'/'}).catch(function(){})})},4000);
})}
})();
