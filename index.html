<style>
@font-face{font-family:GardenHub;src:url(/h/hub-round.woff2) format('woff2');font-display:swap}
@font-face{font-family:PixelHub;src:url(/h/pixel.woff2) format('woff2');font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:GardenHub,"PingFang TC","Heiti TC","Noto Sans TC",sans-serif;color:#4a3b5c;
  background:linear-gradient(180deg,#ffe9f3 0%,#fff4e2 46%,#e4f3ff 100%) fixed;-webkit-user-select:none;user-select:none;overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cl{position:absolute;background:#fff;border-radius:999px;opacity:.8;animation:drift linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl::before{width:52%;height:150%;left:16%;top:-70%}.cl::after{width:36%;height:120%;left:52%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.spk{position:absolute;color:#ffd23f;font-size:18px;animation:tw 3.2s ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.9;transform:scale(1) rotate(30deg)}}
#wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 22px calc(env(safe-area-inset-bottom) + 22px)}
.flags{display:flex;justify-content:center;height:34px;margin:0 -22px 4px;overflow:hidden}
.flags i{width:34px;height:30px;flex:none;clip-path:polygon(0 0,100% 0,50% 100%);margin:0 2px;transform-origin:50% 0;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
header{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 18px}
#wheel{width:150px;height:150px;flex:none;filter:drop-shadow(0 6px 8px rgba(180,120,200,.25))}
.ttl{text-align:left}
h1{margin:0;font-size:60px;line-height:1.1;letter-spacing:2px;font-weight:800;white-space:nowrap}
h1 span{display:inline-block;color:var(--c);text-shadow:0 3px 0 #fff,0 -2px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 6px 10px rgba(150,90,160,.25);animation:hop 2.8s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
@keyframes hop{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-7px)}}
.hi{margin-top:8px;font-size:27px;color:#7a5a92;background:rgba(255,255,255,.75);display:inline-block;padding:8px 18px;border-radius:999px;box-shadow:0 4px 0 rgba(200,160,210,.35)}
#cards{display:grid;gap:22px}
.card{position:relative;display:grid;grid-template-columns:250px 1fr auto;align-items:center;gap:20px;min-height:200px;padding:16px 22px 16px 16px;text-decoration:none;color:inherit;
  border-radius:34px;background:var(--bg);box-shadow:0 10px 0 var(--sh),0 18px 28px rgba(120,80,140,.14);border:4px solid #fff;
  transition:transform .18s cubic-bezier(.3,1.6,.6,1),box-shadow .18s;opacity:0;transform:translateY(26px) scale(.97);animation:rise .6s cubic-bezier(.2,1.3,.5,1) forwards;animation-delay:calc(.08s + var(--i)*.1s)}
@keyframes rise{to{opacity:1;transform:none}}
.card.on{opacity:1;animation:none;transform:none}
.card:active,.card.press{transform:translateY(6px) scale(.985)!important;box-shadow:0 4px 0 var(--sh),0 8px 14px rgba(120,80,140,.12)}
.scene{height:168px;border-radius:24px;overflow:hidden;border:3px solid rgba(255,255,255,.95);box-shadow:inset 0 0 0 2px var(--sh)}
.scene svg{width:100%;height:100%;display:block}
.t{font-size:38px;font-weight:800;color:var(--tx);line-height:1.2}
.s{font-size:24px;color:var(--tx2);margin-top:4px}
.chip{display:inline-block;margin-top:10px;font-size:20px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.8);color:var(--tx2);min-height:38px}
.chip:empty{visibility:hidden}
.go{font-size:28px;font-weight:800;color:#fff;background:var(--ac);padding:20px 26px;border-radius:999px;box-shadow:0 6px 0 var(--sh);white-space:nowrap;animation:nudge 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.4s)}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(5px)}90%{transform:translateX(-2px)}}
.garden{--bg:linear-gradient(135deg,#fdeff5,#eef9e6);--sh:#f2bfd3;--tx:#5a7a3a;--tx2:#a0577a;--ac:#f07aa4}
.volley{--bg:linear-gradient(135deg,#fff1dc,#ffe2c0);--sh:#f5b97c;--tx:#b2560c;--tx2:#8a5a2a;--ac:#ff8a1f}
.blocks{--bg:#bfe6ff;--sh:#3b6e2a;--tx:#2c4a1e;--tx2:#2c4a1e;--ac:#5aa83a;border-radius:10px;border:4px solid #1e1e1e;box-shadow:inset -6px -6px 0 rgba(0,0,0,.12),inset 6px 6px 0 rgba(255,255,255,.5),0 10px 0 #3b6e2a,0 18px 28px rgba(60,90,40,.18)}
.blocks .scene{border-radius:4px;border:3px solid #1e1e1e;box-shadow:none}
.blocks .t,.blocks .s{font-family:PixelHub,GardenHub,sans-serif;text-shadow:2px 2px 0 rgba(255,255,255,.7);letter-spacing:1px}
.blocks .chip{border-radius:4px;font-family:PixelHub,GardenHub,sans-serif;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px #1e1e1e}
.blocks .go{border-radius:4px;font-family:PixelHub,GardenHub,sans-serif;box-shadow:inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.35),0 0 0 4px #1e1e1e;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.quest{--bg:linear-gradient(135deg,#e3f6ff,#eefae2);--sh:#8fd0c6;--tx:#1f6f67;--tx2:#3f6b5c;--ac:#2bb7ab}
.quest .scene{box-shadow:inset 0 0 0 2px #8fd0c6,0 0 16px rgba(57,214,200,.55)}
.qglow{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.qch{animation:bob 1.8s ease-in-out infinite alternate}
.blocks:active,.blocks.press{box-shadow:inset -6px -6px 0 rgba(0,0,0,.12),0 3px 0 #3b6e2a!important}
/* scene motion */
.fw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite}
.bf{animation:fly 9s ease-in-out infinite}
@keyframes fly{0%{transform:translate(20px,70px)}25%{transform:translate(80px,40px) scale(1,.8)}50%{transform:translate(160px,64px)}75%{transform:translate(200px,30px) scale(1,.8)}100%{transform:translate(20px,70px)}}
.vb{animation:bx 2.2s ease-in-out infinite alternate}.vbs{animation:by 1.1s cubic-bezier(.4,0,.6,1) infinite alternate}
.vbs{animation-name:by}.vb .vbs circle{transform-origin:0 0}
@keyframes bx{from{transform:translateX(70px)}to{transform:translateX(170px)}}
@keyframes by{from{transform:translateY(150px)}to{transform:translateY(42px) rotate(200deg)}}
.vsh{animation:bx 2.2s ease-in-out infinite alternate}
.bk{animation:bob 1.6s steps(4) infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}
.sp{animation:bob 1.2s steps(3) infinite alternate-reverse}
footer{text-align:center;margin-top:26px;font-size:20px;color:#a08ab5}
/* leaving transition */
#veil{position:fixed;inset:0;z-index:9;pointer-events:none;background:var(--vc,#fff);clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .55s cubic-bezier(.6,0,.4,1);display:flex;align-items:center;justify-content:center}
#veil.go2{clip-path:circle(150% at var(--x,50%) var(--y,50%));pointer-events:auto}
#veil b{font-size:120px;transform:scale(.3);transition:transform .5s .15s cubic-bezier(.3,1.7,.5,1)}
#veil.go2 b{transform:scale(1)}
/* landscape: three columns */
@media (min-width:1000px) and (orientation:landscape){
  #wheel{width:118px;height:118px}h1{font-size:54px}.hi{font-size:24px}header{margin-bottom:16px}
  #cards{grid-template-columns:repeat(4,1fr);gap:18px}
  .card{grid-template-columns:1fr;text-align:center;padding:14px 12px 20px;gap:10px}
  .scene{height:230px}.go{justify-self:center;padding:16px 34px;font-size:26px}
  .t,.blocks .t{font-size:29px;white-space:nowrap}.s{font-size:20px}.chip{font-size:17px}
}
@media (orientation:portrait) and (min-width:701px){
  header{margin:8px 0 18px}#wheel{width:150px;height:150px}h1{font-size:62px}
  #cards{gap:24px}.card{grid-template-columns:250px 1fr auto;min-height:204px}.t{font-size:35px;white-space:nowrap}.scene{height:172px}
  .blocks .t{font-size:32px;white-space:nowrap}footer{margin-top:34px}
}
.blocks .t{white-space:nowrap}
@media (orientation:portrait) and (min-width:701px) and (max-width:799px){
  .card{grid-template-columns:230px 1fr auto;gap:16px;padding-right:16px}.scene{height:200px}
  .t,.blocks .t{font-size:30px}.go{font-size:24px;padding:18px 18px}
}
@media (max-width:700px){.card{grid-template-columns:1fr;text-align:center}.go{justify-self:center}h1{font-size:44px}#wheel{width:110px;height:110px}}
/* 爸媽專區（熟練地圖） */
.pbtn{display:inline-block;margin-top:14px;font:inherit;font-size:17px;color:#a08ab5;background:rgba(255,255,255,.6);border:0;border-radius:999px;padding:8px 16px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(74,59,92,.45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 16px) 14px 30px}
.gate{margin-top:12vh;background:#fff;border-radius:28px;padding:22px 24px;width:min(420px,100%);text-align:center;box-shadow:0 14px 40px rgba(60,30,80,.3)}
.gate b{font-size:24px}.gate .q{font-size:40px;margin:12px 0 6px;font-weight:800;color:#5a3d7a}.gate .in{font-size:38px;min-height:56px;border-bottom:4px solid #e6d6f0;margin:0 30px 12px;letter-spacing:2px}
.gk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gk button{font:inherit;font-size:28px;padding:12px 0;border:0;border-radius:16px;background:#f3ecf8;color:#4a3b5c}.gk .ok{background:#9b6bff;color:#fff}
.gate small{display:block;color:#a08ab5;font-size:16px;margin-top:10px}
.mm{background:#fffdf8;border-radius:28px;width:min(1080px,100%);padding:18px 18px 22px;box-shadow:0 14px 40px rgba(60,30,80,.3);font-family:GardenHub,"PingFang TC","Noto Sans TC",sans-serif}
.mmtop{display:flex;justify-content:space-between;align-items:center}.mmtop b{font-size:32px;color:#5a3d7a}
.mmx{font:inherit;font-size:20px;border:0;border-radius:999px;background:#efe6f6;color:#5a3d7a;padding:8px 16px}
.mmleg{font-size:21px;margin:8px 2px 4px;color:#4a3b5c}.mmleg small{display:block;font-size:15px;color:#8a7a9a;margin-top:4px}
.mmc{background:#fff;border-radius:22px;padding:12px 14px;margin-top:12px;box-shadow:0 4px 0 #efe3f3}
.mmh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.mmh b{font-size:24px}.mmh span{font-size:17px;color:#7a6a8a}
.mms{font-size:17px;color:#8a7a9a;margin:8px 0 4px}
.mmg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.mmi{display:flex;align-items:center;gap:8px;border-radius:14px;padding:6px 10px;background:#f7f7f7}
.mmi.lg{background:#ebf9ee}.mmi.ly{background:#fff7dc}.mmi.lr{background:#ffe9ea}.mmi.lw{background:#f2f2f4;color:#8a8a96}
.mml{font-size:22px;flex:none}.mmn{display:flex;flex-direction:column;line-height:1.25;min-width:0}.mmn b{font-size:18px;font-weight:800}.mmn small{font-size:14px;color:#6f6480}
.mmsg{margin-top:10px;font-size:19px;color:#3d6b2a;background:#f1faea;border-radius:14px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.card{opacity:1;transform:none}}
</style>

var CL=[null,'二位數加法・不進位','二位數加法・進位','二位數減法・不退位','二位數減法・退位','三位數加法','三位數減法','綜合挑戰','整十整百的乘法','二位數×一位數・不進位','二位數×一位數・進位','三位數×一位數'];
function column(C){var lv=obj(C.lv),fx=obj(C.fx),hist=Array.isArray(C.hist)?C.hist:[],it=[],last=0,k;
  var lt={};hist.forEach(function(x){if(x&&+x.t){lt[x.k]=Math.max(lt[x.k]||0,+x.t);last=Math.max(last,+x.t)}});
  for(k=1;k<CL.length;k++){var s=lv[k],n=s?+s.n||0:0,h=s?String(s.h||''):'',a=h.length?ones(h)/h.length:null,l,nf=0;
    for(var f in fx){var q=fx[f]&&fx[f].q;if(q&&+q.k===k)nf++}
    if(!n)l='w';else if(n>=10&&a>=.85)l='g';else if(a<.7&&h.length>=3)l='r';else l='y';
    it.push({l:l,n:k+'. '+CL[k],d:n?'最近 '+Math.floor(a*100)+'%・'+n+' 題'+(n<10&&l==='y'?'・還要多練':'')+(nf?'・待修 '+nf:''):'',t:lt[k]||0,k:k,a:a})}
  var nx=pick(it,[1,2,3,4,5,6,8,9,10,11,7]),sg=nx?(nx.l==='w'?'開始挑戰第 '+nx.k+' 關「'+CL[nx.k]+'」':'多練第 '+nx.k+' 關「'+CL[nx.k]+'」'+(nx.l==='r'?'（一次就對的比例還偏低）':'')):'每一關都精通了，可以玩綜合挑戰';
  return {t:'⛏️ 直式計算小達人',sub:'每一關',it:it,last:last,sg:sg}}
/* 單字：每週單字表（學會＝最近 4 次至少對 3 次，跟 Ante島開花一樣）＋句子練習每個句型 */
var SP={isThere:'Is there…?',areThere:'Are there…?',isIt:'Is this / that / it…?',areThey:'Are these / those…?',whatIs:'What is this?',whatAre:'What are these?',whatColor:'What color…?',howMany:'How many…?',whereIs:'Where is…?',whereAre:'Where are…?',whereWho:'Where is / are＋誰的…？'};
function vocab(V){var st=obj(V.stats),fx=obj(V.fix),it=[],it2=[],last=0;
  (Array.isArray(V.weeks)?V.weeks:[]).forEach(function(wk,i){var ws=Array.isArray(wk.words)?wk.words:[],m=0,pr=0,ok=0,tot=0,lt=0,nf=0;if(!ws.length)return;
    ws.forEach(function(x){var s=st[x.id];if(fx[x.id])nf++;if(!s)return;var h=String(s.h||'').slice(-4);if((+s.c||0)+(+s.w||0)+(+s.x||0)>0)pr++;if((+s.c||0)+(+s.x||0)>=3&&ones(h)>=3)m++;ok+=ones(h);tot+=h.length;lt=Math.max(lt,+s.ls||0)});
    last=Math.max(last,lt);var r=m/ws.length,acc=tot?ok/tot:0,l;
    if(!pr)l='w';else if(r>=.8&&nf<=1)l='g';else if((r<.5&&acc<.7)||nf>=Math.max(3,ws.length*.3))l='r';else l='y';
    it.push({l:l,n:String(wk.name||('第'+(i+1)+'週')),d:pr?'學會 '+m+' / '+ws.length+' 個'+(nf?'・澆水 '+nf:''):ws.length+' 個字',t:lt,k:i,r:r})});
  var sst=obj(V.sst),sf=obj(V.sfix),sl=0;
  Object.keys(SP).forEach(function(p){var s=sst[p],l,d='';if(!s||!((+s.c||0)+(+s.w||0))){it2.push({l:'w',n:SP[p],d:'',t:0,k:p});return}
    var h=String(s.h||''),k=ones(h),tot=(+s.c||0)+(+s.w||0),life=(+s.c||0)/tot;sl=Math.max(sl,+s.ls||0);
    if(k>=3&&life>=.6)l='g';else if((k<=1&&h.length>=2)||(life<.5&&tot>=4))l='r';else l='y';
    it2.push({l:l,n:SP[p],d:'最近 '+k+' / '+h.length+' 對・總共 '+(+s.c||0)+' / '+tot+(sf[p]?'・澆水中':''),t:+s.ls||0,k:p,life:life})});
  last=Math.max(last,sl);var nw=pick(it,null),ns=pick(it2,null),a=[];
  if(nw&&nw.l!=='g')a.push((nw.l==='w'?'開始練':'複習')+'「'+nw.n+'」的單字');
  if(ns&&ns.l!=='g')a.push('句子練習選「'+ns.n+'」'+(ns.l==='w'?'試試看':'多練幾次'));
  return {t:'🌸 單字小達人',sub:'每週單字表',it:it,sub2:'🗣️ 句子練習・每個句型',it2:it2,last:last,sg:a.length?a.join('；'):'單字和句型都很穩，可以加新的一週'}}
/* 應用題：每個單元、每種思考題（整題一次就做對的比例；跟 App 家長設定一樣用 85% / 60%） */
var QU={1:'🌾 單元 1・200以內的數',2:'🏮 單元 2・二位數的加減',3:'🌋 單元 3・公分',4:'🏡 單元 4・加減應用',5:'💧 單元 5・容量',6:'🪶 單元 6・加減兩步驟'};
var QT=[['ask','① 看懂題目問什麼','ask'],['story','同一則故事兩問',null],['extra','哪個數字用不到','extra'],['err','幫林克找錯','spot'],['qpick','選對的問句','qpick']];
function lt3(c,n,min){if(!n)return 'w';var r=c/n;if(r>=.85&&n>=min)return 'g';if(r<.6&&n>=3)return 'r';return 'y'}
function quest(Q){var u=obj(Q.u),tk=obj(Q.tk),st=obj(Q.st),it=[],it2=[],last=0;
  (Array.isArray(Q.hist)?Q.hist:[]).forEach(function(x){if(x&&+x.t)last=Math.max(last,+x.t)});
  Object.keys(QU).forEach(function(k){var o=u[k]||{},n=+o.n||0,f=+o.f||0,l=lt3(f,n,5);it.push({l:l,n:QU[k],d:n?'一次就對 '+f+' / '+n+'（'+Math.floor(f/n*100)+'%）':'',t:+o.t||0,k:+k,r:n?f/n:0})});
  QT.forEach(function(q){var o=q[0]==='ask'?st.ask:(tk[q[0]]||(q[2]?st[q[2]]:null)),c=o?+o.c||0:0,n=o?c+(+o.w||0):0,l=lt3(c,n,3);
    it2.push({l:l,n:q[1],d:n?'第一次就做對 '+c+' / '+n:'',k:q[0],r:n?c/n:0})});
  var nu=pick(it,[1,2,3,4,5,6]),nt=pick(it2.slice(1),null),a=[];
  if(nu&&nu.l!=='g')a.push((nu.l==='w'?'開始玩':'多練')+'「'+nu.n.replace(/^\S+ /,'')+'」（從冒險地圖點那個地區）');
  if(nt&&nt.l==='w')a.push('思考石板還沒練過，多玩幾輪就會出現');else if(nt&&nt.l!=='g')a.push('思考題「'+nt.n+'」要多練');
  return {t:'🗡️ 林克的解題冒險',sub:'每個單元',it:it,sub2:'🧩 每種思考題',it2:it2,last:last,sg:a.length?a.join('；'):'每個單元和思考題都很穩'}}
/* 下一步：先挑「常卡」，再挑「還沒練」，再挑「偶爾錯」 */
function pick(it,order){var o=it.slice();if(order)o.sort(function(a,b){return order.indexOf(a.k)-order.indexOf(b.k)});
  var w={r:0,w:1,y:2};for(var lv in w){var c=o.filter(function(x){return x.l===lv});if(c.length){if(lv==='r'||lv==='y')c.sort(function(a,b){return (a.r!=null&&b.r!=null)?a.r-b.r:0});return c[0]}}return null}
function J(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
function all(){var r=[],o;if(o=J('timesApp.v1'))r.push(times(o));if(o=J('columnApp.v1'))r.push(column(o));if(o=J('vocabApp.v1'))r.push(vocab(o));if(o=J('questApp.v1'))r.push(quest(o));return r}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cells(it){return '<div class="mmg">'+it.map(function(x){return '<div class="mmi l'+x.l+'"><span class="mml">'+LT[x.l][0]+'</span><span class="mmn"><b>'+esc(x.n)+'</b><small>'+LT[x.l][1]+(x.d?'・'+esc(x.d):'')+(x.t?'・'+md(x.t):'')+'</small></span></div>'}).join('')+'</div>'}
function html(){var A=all(),h='<div class="mmtop"><b>📊 熟練地圖</b><button class="mmx" data-mm="close">✕ 關閉</button></div>'+
  '<div class="mmleg">🟢 穩　🟡 偶爾錯　🔴 常卡　⚪ 還沒練<small>讀這台 iPad 上的進度（有開雲端同步就包含其他裝置）。日期是最後練習的那天（台灣時間）。</small></div>';
  if(!A.length)h+='<div class="mmc">這台裝置還沒有練習紀錄。</div>';
  A.forEach(function(a){h+='<div class="mmc"><div class="mmh"><b>'+a.t+'</b><span>'+(a.last?'最後練習：'+md(a.last):'還沒練習')+'</span></div><div class="mms">'+esc(a.sub)+'</div>'+cells(a.it)+
    (a.it2?'<div class="mms">'+esc(a.sub2)+'</div>'+cells(a.it2):'')+'<div class="mmsg">👉 下一步：'+esc(a.sg)+'</div></div>'});
  return h}
return {html:html,times:times,column:column,vocab:vocab,quest:quest,tLevel:tLevel}})();

var GQ=null,GV='';
function ovClose(){var o=$('#pov');if(o)o.remove()}
function gateDraw(){var o=$('#pov');if(!o){o=document.createElement('div');o.id='pov';o.className='ov';document.body.appendChild(o)}
  o.innerHTML='<div class="gate"><b>🔒 爸媽專區</b><div class="q">'+GQ[0]+' × '+GQ[1]+' = ?</div><div class="in">'+(GV||'&nbsp;')+'</div><div class="gk">'+
  ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(function(k){return '<button data-k="'+k+'"'+(k==='OK'?' class="ok"':'')+'>'+k+'</button>'}).join('')+'</div><small>請大人回答・<span data-k="x" style="text-decoration:underline">取消</span></small></div>'}
function gateOpen(){GQ=[12+Math.floor(Math.random()*8),12+Math.floor(Math.random()*8)];GV='';gateDraw()}
function mmOpen(){var o=$('#pov');if(!o){o=document.createElement('div');o.id='pov';o.className='ov';document.body.appendChild(o)}o.innerHTML='<div class="mm">'+MM.html()+'</div>';o.scrollTop=0}
$('#pbtn').addEventListener('click',gateOpen);
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-k],[data-mm]');if(!t){if(e.target.id==='pov')ovClose();return}
  if(t.dataset.mm==='close'){ovClose();return}var k=t.dataset.k;if(!k)return;
  if(k==='x'){ovClose();return}if(k==='⌫'){GV=GV.slice(0,-1)}else if(k==='OK'){if(+GV===GQ[0]*GQ[1]){mmOpen();return}GQ=[12+Math.floor(Math.random()*8),12+Math.floor(Math.random()*8)];GV=''}else if(GV.length<4)GV+=k;gateDraw()});
window.__mm=MM;
window.addEventListener('pageshow',function(){veil.classList.remove('go2');busy=false;chips()});
/* offline: hub files, and warm up the four games so they open even without Wi-Fi */
if('serviceWorker' in navigator){window.addEventListener('load',function(){
  navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(function(){});
  setTimeout(function(){['vocab','times','column','quest'].forEach(function(a){navigator.serviceWorker.register('/'+a+'/sw.js',{scope:'/'+a+'/'}).catch(function(){})})},4000);
})}
})();
</script>
